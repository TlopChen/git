# OxiDNS 镜像 CI：GitHub Actions 拉镜像 → docker save → 推到 oxidns-images 分支
# 触发：① Actions 页面手动 Run workflow（填 OxiDNS tag）；
#       ② 本地 git push 一个形如 oxidns-image-v1.6.1 的 tag（无需任何令牌，tag 名即版本号）。
# 不启用 schedule / 新版本自动检测：升级一律人工触发（用户口径 2026-10-08）。
# 广州节点只负责把该分支里的 tar 发到 HTTP 目录（scripts/_infra/oxidns-image-sync.sh），ROS 再按需拉取。
# 为什么不在广州本地 docker pull：广州对 Docker Hub 的解析被投毒/被墙（实测 auth.docker.io 超时、
# registry-1.docker.io 解析到 Facebook IPv6 段）。
name: oxidns-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "OxiDNS 版本 tag（如 v1.6.1）"
        required: true
        default: "v1.6.1"
      branch:
        description: "发布 tar 的分支"
        required: true
        default: "oxidns-images"
  push:
    tags:
      - "oxidns-image-*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 解析版本与目标分支
        id: v
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            BRANCH="${{ inputs.branch }}"
          else
            TAG="${GITHUB_REF_NAME#oxidns-image-}"
            BRANCH="oxidns-images"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "将构建 oxidns:$TAG → 分支 $BRANCH"

      - name: 拉取并保存镜像
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "docker.io/svenshi/oxidns:${TAG}"
          docker save -o "oxidns-${TAG}-linux-amd64.tar" "docker.io/svenshi/oxidns:${TAG}"
          sha256sum "oxidns-${TAG}-linux-amd64.tar" > "oxidns-${TAG}-linux-amd64.tar.sha256"
          ls -l oxidns-*

      - name: 发布到镜像分支
        env:
          TAG: ${{ steps.v.outputs.tag }}
          BRANCH: ${{ steps.v.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch "${BRANCH}" "${URL}" pub 2>/dev/null; then
            echo "分支已存在"
          else
            git clone --depth 1 "${URL}" pub
            ( cd pub && git checkout --orphan "${BRANCH}" && git rm -rf --quiet . )
          fi
          cd pub
          mkdir -p oxidns
          cp "../oxidns-${TAG}-linux-amd64.tar" "../oxidns-${TAG}-linux-amd64.tar.sha256" oxidns/
          ls -1t oxidns/oxidns-v*-linux-amd64.tar 2>/dev/null | tail -n +4 | while read -r old; do
            rm -f "${old}" "${old}.sha256"
          done
          TAG="${TAG}" python3 - <<'PY' > oxidns/manifest.json
          import hashlib, json, os, pathlib
          tag = os.environ["TAG"]
          files = sorted(p.name for p in pathlib.Path("oxidns").glob("oxidns-v*-linux-amd64.tar"))
          latest = f"oxidns-{tag}-linux-amd64.tar"
          data = open("oxidns/" + latest, "rb").read()
          print(json.dumps({
              "latest": {"tag": tag, "file": latest, "bytes": len(data),
                         "sha256": hashlib.sha256(data).hexdigest()},
              "available": files,
          }, indent=2))
          PY
          git add -A oxidns
          git commit -m "oxidns image ${TAG}" || echo "无变化"
          git push origin "HEAD:${BRANCH}"
